mod_description=Adds a working PAPI (Precision Approach Path Indicator) light array built from Create's nixie tube parts. Four units in a row, or two for an APAPI, show red or white depending on each viewer's own angle relative to a configurable glideslope.

# --- Compile-time / runtime mod dependencies (resolved from the local mods/ folder) ---
